<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Details</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 2rem; }
    .card { max-width: 720px; margin: 0 auto; padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.06); }
    .muted { color: #6b7280; }
    h1 { margin-top: 0; }
    .error { color: #b91c1c; background: #fee2e2; padding: .75rem 1rem; border-radius: 12px; }
    .meta { margin-top: 1rem; font-size: .9rem; color: #6b7280; }
    .grid { display: grid; grid-template-columns: 140px 1fr; gap: .5rem 1rem; }
    .key { font-weight: 600; color: #374151; }
    .value { color: #111827; }
    footer { margin-top: 2rem; text-align: center; color: #9ca3af; font-size: .9rem; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Details</h1>
    <div id="content" class="muted">Loading…</div>
    <div class="meta" id="meta"></div>
  </div>
  <footer>Powered by a tiny serverless function. Swap the data in <code>getDetail.js</code>.</footer>

  <script>
    function qs(name) {
      const params = new URLSearchParams(location.search);
      return params.get(name);
    }
    const id = qs('id') || 'ABC123';
    document.getElementById('meta').textContent = "Query id = " + id;

    async function fetchDetail() {
      const endpoint = '/api/getDetail?id=' + encodeURIComponent(id);
      try {
        const res = await fetch(endpoint, { headers: { 'Accept': 'application/json' } });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        render(data);
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="error">Error: ' + err.message + '</div>';
      }
    }

    function render(data) {
      const content = document.getElementById('content');
      const fields = Object.entries(data).map(([k, v]) => {
        const value = (typeof v === 'object') ? JSON.stringify(v) : v;
        return `<div class="key">${k}</div><div class="value">${value}</div>`
      }).join('');
      content.classList.remove('muted');
      content.innerHTML = '<div class="grid">' + fields + '</div>';
    }

    fetchDetail();
  </script>
</body>
</html>
